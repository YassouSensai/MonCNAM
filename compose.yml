services:
  db:
    image: postgres:15-alpine
    container_name: moncnam_db
    environment:
      - POSTGRES_USER=hodory
      - POSTGRES_PASSWORD=hodory
      - POSTGRES_DB=hodory
    ports:
      - "5445:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    image: python:3.11-slim
    container_name: moncnam_backend
    working_dir: /app
    volumes:
      - ./backend:/app 
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://hodory:hodory@db:5432/hodory
      - SECRET_KEY=cle_secrete_moncnam_tres_longue_123
      - INIT_DB_ON_STARTUP=1
      - RELOAD=1
    depends_on:
      - db
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             python runserver.py"

  portal:
    image: nginx:alpine
    container_name: moncnam_portal
    ports:
      - "8080:80"
    volumes:
      - ./accueil:/usr/share/nginx/html

  admin:
    image: node:20-alpine
    container_name: moncnam_admin
    working_dir: /app
    volumes:
      - ./frontend_admin:/app
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - WATCHPACK_POLLING=true
    command: sh -c "npm install && npm run dev -- -p 3000 -H 0.0.0.0"

  teacher:
    image: node:20-alpine
    container_name: moncnam_teacher
    working_dir: /app
    volumes:
      - ./frontend_profs:/app
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - WATCHPACK_POLLING=true
    command: sh -c "npm install && npm run dev -- -p 3001 -H 0.0.0.0"

  student:
    image: node:20-alpine
    container_name: moncnam_student
    working_dir: /app
    volumes:
      - ./frontend_eleves:/app
    ports:
      - "3002:3002"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - WATCHPACK_POLLING=true
    command: sh -c "npm install && npm run dev -- -p 3002 -H 0.0.0.0"

volumes:
  db_data: